{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow p-4">

<h2 class="text-center mb-4">
Login
</h2>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary w-100">
Login
</button>

</form>

<br>

<p class="text-center">

Don't have an account?

<a href="{% url 'register' %}">
Register
</a>

</p>

</div>

</div>

</div>

{% endblock %}
