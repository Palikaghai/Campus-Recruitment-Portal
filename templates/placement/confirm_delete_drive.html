{% extends "base.html" %}

{% block title %}Confirm Delete Drive | Placement Officer{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 text-center bg-white">
                <div class="bg-danger bg-opacity-10 text-danger rounded-circle mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                    <i class="bi bi-trash fs-2"></i>
                </div>
                <h4 class="fw-bold mb-2">Delete Drive Record?</h4>
                <p class="text-muted mb-4">
                    Are you sure you want to delete the placement drive for <strong>"{{ drive.job_role }}"</strong> at <strong>{{ drive.company.name }}</strong>?
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'placement_manage_drives' %}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4 fw-semibold">Delete Drive</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
